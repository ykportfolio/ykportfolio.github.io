{% assign t = site.data.us_ua[page.lang] %}

<!DOCTYPE html>
<html lang="{{ t.lang }}">
    
{% include head.html %}

  <body>
    <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WZVQNV9D"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
    {% include header.html t=t %}

<div class="thank-page">
    <div class="thank-overlay">
  <h1>{{ t.seo.thank.title }}</h1>
  <p>{{ t.seo.thank.description }}</p>
  <div class="thank-page-buttons">
  <a href="{% if page.lang == 'en' %}/{% else %}/ua/{% endif %}" class="btn-back">
    {{ t.back_mainpage }}
  </a>
  <a href="{% if page.lang == 'en' %}/gallery/{% else %}/ua/gallery/{% endif %}" class="btn btn-secondary">
    {{ t.view_gallery }}
  </a>
  </div>
  </div>
</div>
{% include footer.html t=t %}
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </body>
</html>
