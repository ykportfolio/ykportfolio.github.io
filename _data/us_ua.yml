  aboutme:
    title: "WebAnd3D — 3D-моделювання, 3D-друк і веброзробка"
    text1: "Привіт! Я Юля Карась — займаюся <strong>3D-моделюванням</strong>, <strong>створюю авторські вироби</strong> за допомогою 3D-друку та <strong>розробляю сайти для бізнесу</strong>. <br/> <strong>WebAnd3D</strong> — моя творча лабораторія, де цифрові ідеї перетворюються на фізичні вироби, а бізнес отримує власне місце в інтернеті."
    subtitle2: "3D-моделювання та STL-файли для 3D-друку"
    text2: "Розробляю власні тривимірні моделі для створення фізичних виробів. Це можуть бути декоративні предмети, органайзери, корисні деталі та інші об'єкти, які можна виготовити за допомогою 3D-принтера. <br/>На WebAnd3D ви зможете знайти авторські <strong>STL-файли для 3D-друку</strong>, використовувати цифрові моделі для власних проєктів і відкривати нові можливості адитивного виробництва. <br/>Мене цікавить не лише створення красивих об'єктів, а й пошук практичних рішень: як зробити річ зручною, функціональною та придатною для виготовлення на 3D-принтері."
    subtitle3: "Оригінальні подарунки з 3D-друку"
    text3: "Шукаєте незвичайний подарунок, якого немає в кожному магазині? <br/>Я створюю <strong>креативні подарунки</strong> з 3D-друку, <strong>декоративні вироби</strong> та <strong>корисні речі для дому</strong> й повсякденного використання. Можна обрати готовий виріб або обговорити індивідуальну ідею. <br/>Можливість персоналізації, доступні матеріали та терміни виготовлення залежать від конкретного виробу. <br/>Орієнтовний термін виготовлення готового подарунка — 1–3 дні. Складні індивідуальні замовлення можуть потребувати більше часу."
    subtitle4: "Розробка сайтів для малого бізнесу"
    text4: "Власний сайт допомагає бізнесу презентувати свої послуги, показувати роботи, розповідати про продукти та знаходити нових клієнтів. <br/> Я допомагаю малому бізнесу й фахівцям створювати сайти, які відповідають їхнім завданням і стилю бренду. Основні напрямки веброзробки:<br/> <strong>Розробка лендінгів</strong>. Односторінкові сайти для презентації послуг, товарів, рекламних кампаній або окремих пропозицій.<br/> <strong>Корпоративні сайти</strong>. Багатосторінкові сайти для компаній, які хочуть представити свій бізнес, послуги та контакти в інтернеті.<br/> <strong>Сайти-портфоліо</strong>. Презентація робіт, досвіду й професійних навичок для фахівців, дизайнерів, розробників та інших творчих професій. <br/>Під час розробки я приділяю увагу структурі сторінок, адаптації для мобільних пристроїв, швидкості завантаження та базовій SEO-оптимізації. Мета — створити зрозумілий і впізнаваний сайт, який допомагатиме досягати цілей бізнесу."
    subtitle5: "Терміни розробки та виготовлення"
    text5: "Терміни залежать від складності проєкту, обсягу робіт і готовності матеріалів. 3D-друковані подарунки: орієнтовно 1–3 дні для готових моделей. Лендінг: орієнтовно 3–10 днів залежно від складності, обсягу робіт і поточного завантаження. Корпоративні сайти та портфоліо: індивідуальний термін залежно від кількості сторінок і необхідного функціоналу. STL-файли: цифрові моделі доступні відповідно до умов, зазначених на сторінці кожного файлу."
    subtitle6: "WebAnd3D — від цифрової моделі до готового результату"
    text6: "WebAnd3D об'єднує 3D-моделювання, авторські вироби з 3D-друку та веброзробку. Тут можна знайти цифрові моделі для власних проєктів, обрати оригінальний подарунок або замовити сайт для бізнесу. Маєте ідею виробу або шукаєте розробника для свого сайту? Зв'яжіться зі мною через сторінку контактів, щоб обговорити завдання, терміни та вартість."
    quote: "Я не хочу знайти своє місце у світі. Я хочу створити своє."
