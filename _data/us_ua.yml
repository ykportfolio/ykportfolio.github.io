    text2: "I have a solid technical education and hands-on experience in development and working with modern digital tools. I have a strong understanding of computer system architecture, programming logic, and the principles behind creating high-quality IT products. I quickly learn new technologies and seamlessly combine technical expertise with creative thinking — allowing me to deliver well-crafted, user-friendly, and visually appealing products for my clients."
