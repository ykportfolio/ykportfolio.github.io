  aboutme:
    title: "Про мене"
    subtitle1: "Де технології зустрічають бачення"
    text1: "Привіт! Я Юлія Карась — веб-розробник та 3D-художниця. Для мене цифрове мистецтво та технології — це не просто набір інструментів, а спосіб допомагати людям, розвивати бізнеси та створювати проєкти, що залишають слід у серцях."
    subtitle2: "Веб-розробка, що працює на результат"
    text2: "Я допомагаю бізнесам і приватним клієнтам отримати ефективний онлайн-інструмент: створюю статичні та адаптивні сайти, оптимізую швидкодію, налаштовую аналітику GA4, роблю SEO-оптимізацію. Працюю з WordPress, Joomla, PrestaShop та використовую Git для командної роботи. Моє завдання — щоб сайт не лише гарно виглядав, а й працював швидко, був зручним і приносив результат."
    subtitle3: "CGI з серцем"
    text3: "Я мрію створювати CGI-мультфільми та 3D-проєкти, які зворушують і очі, і душу — історії, що навчають дітей доброті у світі, де так багато болю та війни. Поєдную творчість із професійними технічними навичками, щоб кожна робота була не просто зображенням, а повноцінною історією."
    subtitle4: "Чим я можу бути корисною"
    text4: "Для бізнесу — створю сучасні, адаптивні та швидкі сайти, які підвищують конверсії та імідж бренду."
    text5: "Для онлайн-продажів — налаштую інтернет-магазини на WordPress, PrestaShop, з SEO та аналітикою для зростання продажів."
    text6: "Для маркетингу та реклами — розроблю 3D-візуалізації продуктів, які привернуть увагу та продають."
    text7: "Для ігор — змоделюю оптимізовані low-poly та PBR-ассети для інтерактивних проєктів."
    text8: "Для особистих проєктів — допоможу втілити ідеї в 3D-моделях, рендерах або веб-сторінках, що справлять враження."
    quote: "Створюй мистецтво та технології, що торкаються майбутнього — і серця прийдуть самі."
