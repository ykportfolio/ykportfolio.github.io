    text3: "My passion lies in the visual side of the digital world — design, 3D art, and motion. I love creating things that are not only functional but also beautiful and emotionally engaging. Whether it’s a website, a 3D model, or a short animation — I always aim to make it meaningful and full of life."
    subtitle4: "My Dream"
    text4: "My biggest dream is to become one of the leading creators of children’s animated films in Ukraine — stories that not only teach, but also touch the heart. I believe that art and technology can work together to inspire kindness, imagination, and hope."
