  aboutme:
    title: "Про мене"
    text1: "Привіт! Мене звати Юлія, я веброзробниця та 3D-художниця з України. Я закінчила Сумський державний університет за спеціальністю математика та програмування (спеціаліст у галузі системних наук і кібернетики: інформатика)."
    subtitle2: "Освіта і досвід"
    text2: "Маю ґрунтовну технічну освіту та реальний практичний досвід у розробці й роботі з сучасними цифровими інструментами. Добре розумію структуру комп’ютерних систем, логіку програмування та принципи створення якісних ІТ-продуктів. Легко опановую нові технології та гнучко поєдную технічні навички з творчими рішеннями — саме це дозволяє мені створювати продумані, зручні та візуально привабливі продукти для клієнтів."
    subtitle3: "Моя пристрасть"
    text3: "Моя пристрасть — візуальна сторона цифрового світу: дизайн, 3D-мистецтво та моушн-дизайн. Я люблю створювати речі, які не лише функціональні, а й естетично красиві та емоційно наповнені. Чи то вебсайт, чи 3D-модель, чи коротка анімація — я завжди прагну, щоб у роботі відчувалося життя і сенс."
    subtitle4: "Моя мрія"
    text4: "Моя найбільша мрія — стати однією з провідних творців дитячих анімаційних фільмів в Україні — історій, які не лише навчають, а й торкаються серця. Я вірю, що мистецтво й технології можуть разом надихати доброту, уяву та надію."
    subtitle5: "Чим я можу бути корисною"
    text5: "Як веброзробниця та цифрова художниця, я можу створити сучасні, привабливі та зручні сайти — від лендінгів і персональних портфоліо до невеликих бізнес-сайтів. Я приділяю увагу як дизайну, так і функціональності, щоб кожен проєкт не лише гарно виглядав, а й працював швидко та доносив потрібне повідомлення. Також можу допомогти з SEO-оптимізацією, покращенням UI/UX, підключенням аналітики чи форм зворотного зв’язку — усім, що потрібно для ефективної онлайн-присутності."    
    quote: "Створюй мистецтво та технології, що торкаються майбутнього — і серця прийдуть самі."
