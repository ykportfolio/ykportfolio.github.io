  aboutme:
    title: "About Me"
    subtitle1: "Life is not a straight road"
    text1: "I love movement. You don't always need to know where it's going to take you. Sometimes the most interesting thing is simply to take a different road and see what happens next.<br/>My passion is speed, motorcycles, and roads without a fixed destination. Discovering beautiful new places, feeling the wind, the freedom, and that moment when you're simply riding without knowing what's waiting around the next corner.<br/>I love a hot sauna and an ice-cold plunge — those moments when you can finally switch your mind off and feel your body again. I love moments when there is nowhere to rush to.<br/>And I love my family. They are probably the most precious thing I have.<br/>I'm a mother of three girls, so the time I spend with them truly matters to me. I don't want to look back one day and realize that the best years of my life disappeared somewhere between deadlines.<br/>I don't chase expensive things, and I don't post every step of my life on social media just for approval. Living my life for show isn't my thing.<br/>I'd rather actually experience a moment than collect a hundred reactions to it.<br/>I care more about living than demonstrating how I live.<br/>That said, if I meet a like-minded person, I'm always open to a good conversation. I enjoy people who are interested in ideas, dreams, technology, strange little projects, and new possibilities.<br/>Maybe that's the kind of connection I value most — not collecting contacts, but exchanging thoughts."
    subtitle2: "I like figuring things out"
    text2: "I'm Yuliia — a web developer, 3D artist, and a person who is constantly asking: what if I did it differently?<br/>I graduated from Sumy State University with a Specialist degree in Computer Science and Informatics.<br/>I've worked with web development, design, SEO, and digital tools. These days, I'm exploring 3D, 3D printing, animation, artificial intelligence, and automation.<br/>Technology I don't know doesn't scare me.<br/>Quite the opposite.<br/>If I don't know how to do something, I get curious.<br/>I love creating.<br/>A website that doesn't work like every other website.<br/>A 3D model that you can not only imagine, but actually explore and turn around in a 3D environment.<br/>A physical product that didn't exist before.<br/>An animation. A story. An educational project. A technology.<br/>Maybe one day, something that doesn't even have a job title yet."
    subtitle3: "I don't fit very well into boxes"
    text3: "I like standing somewhere between the digital and physical worlds and seeing what can be created there.<br/>That's also why I'm not particularly drawn to the traditional 9-to-5 job.<br/>Not because I don't like working.<br/>When something really grabs me, I can work on it until late at night. But I don't want my value to be measured by the number of hours I spend sitting in front of a computer.<br/>Creativity suffocates when being present at the workplace becomes more important than what you actually create.<br/>I need space to think, experiment, fail, change direction, and start again.<br/>I need freedom.<br/>And at the same time, I need time for the people I love.<br/>Maybe someday I'll work full-time. But it has to be a project I genuinely care about. Because working only for money, for me, is a straight road to burnout.<br/>I don't know what my work will look like ten years from now.<br/>And honestly, I don't want to know.<br/>I like the fact that there is still so much unknown ahead."
    subtitle4: "What Can I Do for You?"
    text4: "I can help turn an idea into something real.<br/>A website that doesn't just exist on the internet, but actually serves a purpose. I can help with the structure, design, and presentation, make complicated things easier to understand, add the functionality you actually need, and leave you with something you can work with — not a mess you'll have to untangle later.<br/>I can join a project where it's already stuck, figure out what's not working, or help come up with a solution that didn't exist in the first place.<br/>I'm interested in tasks that require thinking, not just following a checklist.<br/>But there's one thing you should know.<br/>I'm not your person if you need someone who will silently do exactly what you say, tick the box, and leave.<br/>I will ask questions. I may disagree. I may suggest a different approach. And if I see a way to make something better, I'll tell you.<br/>But if you need someone who isn't afraid to figure things out, come up with ideas, try something new, and actually get it done — we might be a good match."
    quote: "I don't want to find my place in the world. I want to create my own."
