    text5: "As a web developer and digital artist, I can create modern, visually appealing, and user-friendly websites — from landing pages and personal portfolios to small business sites. I pay attention to both design and functionality, ensuring every project not only looks good but also works smoothly and communicates your message effectively. I can also help with SEO optimization, UI/UX improvements, and integration with analytics or contact forms — everything needed to make your online presence stand out."
