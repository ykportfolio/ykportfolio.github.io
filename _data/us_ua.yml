  aboutme: 
    title: "About Me"
    subtitle1: "Where Technology Meets Vision"
    text1: "Hi! I’m Yuliia Karas — a web developer and 3D artist. For me, digital art and technology are not just a set of tools, but a way to help people, grow businesses, and create projects that leave a lasting impact."
    subtitle2: "Web Development That Delivers Results"
    text2: "I help businesses and private clients get an effective online tool: I create static and responsive websites, optimize performance, set up GA4 analytics, and perform SEO optimization. I work with WordPress, Joomla, PrestaShop, and use Git for collaborative work. My goal is to ensure that a website not only looks great but also works fast, is user-friendly, and delivers results."
    subtitle3: "CGI with Heart"
    text3: "I dream of creating CGI animations and 3D projects that touch both the eyes and the soul — stories that teach children kindness in a world with so much pain and war. I combine creativity with professional technical skills so that each work becomes more than just an image, but a complete story."
    subtitle4: "How I Can Be Helpful"
    text4: "For businesses — I create modern, responsive, and fast websites that increase conversions and enhance brand image."
    text5: "For online sales — I set up online stores on WordPress and PrestaShop with SEO and analytics to grow sales."
    text6: "For marketing and advertising — I design 3D product visualizations that attract attention and sell."
    text7: "For games — I model optimized low-poly and PBR assets for interactive projects."
    text8: "For personal projects — I bring ideas to life in 3D models, renders, or web pages that make an impression."
    quote: "Create art and technology that touch the future — and hearts will follow."
