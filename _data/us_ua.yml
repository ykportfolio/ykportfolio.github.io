  aboutme:
    title: "WebAnd3D — 3D Modeling, 3D Printing & Web Development"
    text1: "Hi! I'm Yuliia Karas. I create <strong>3D models</strong>, <strong>design original products</strong> using 3D printing, and <strong>build websites for businesses</strong>.<br/><strong>WebAnd3D</strong> is my creative lab, where digital ideas become physical products and businesses get their own place on the web."
    subtitle2: "3D Modeling and STL Files for 3D Printing"
    text2: "I design original 3D models for physical products, from decorative objects and organizers to functional parts and other items that can be manufactured using a 3D printer.<br/> At WebAnd3D, you can explore original <strong>STL files</strong> for 3D printing, use digital models in your own projects, and discover new possibilities for additive manufacturing. <br/> I'm interested not only in creating visually appealing objects but also in finding practical solutions — making products useful, functional, and suitable for 3D printing."
    subtitle3: "Creative 3D Printed Gifts"
    text3: "Looking for a unique gift that you won't find in every store?<br/> I create <strong>creative 3D printed gifts</strong>, <strong>decorative objects</strong>, and <strong>practical accessories for the home</strong> and everyday life.<br/> You can choose a ready-made product or discuss a custom idea with me. Personalization options, available materials, and production times depend on the specific design. <br/>The estimated production time for ready-made gift designs is 1–3 days. Custom or more complex orders may take longer."
    subtitle4: "Website Development for Small Businesses"
    text4: "A website helps a business showcase its services, present its work, explain its products, and reach new customers. I help <strong>small businesses</strong> and independent professionals <strong>build websites</strong> that fit their goals and brand identity.<br/><br/>My <strong>web development services</strong> include:<br/> <strong>Landing page development</strong>. Single-page websites for presenting services, products, campaigns, or specific offers.<br/><strong>Business website development</strong>. Multi-page websites that introduce a company, explain its services, and provide essential business information. <br/><strong>Portfolio websites</strong>. Websites that showcase projects, experience, and professional skills for developers, designers, and other creative professionals. <br/><br/> My development process focuses on clear page structure, mobile responsiveness, loading speed, and basic SEO optimization. <br/>The goal is to create a recognizable, user-friendly website that supports your business objectives."
    subtitle5: "Production and Development Timeframes"
    text5: "Project timelines depend on complexity, scope, and the availability of the required content and materials.<br/><strong>3D printed gifts</strong>: approximately 1–3 days for ready-made designs. <br/><strong>Landing pages</strong>: approximately 3–10 days, depending on complexity, workload, and project requirements.<br/><strong>Business websites</strong> and portfolios: timelines are determined individually based on the number of pages and required functionality.<br/><strong>STL files</strong>: digital models are available according to the terms specified on each file's page."
    subtitle6: "WebAnd3D — From Digital Models to Real-World Results"
    text6: "<strong>WebAnd3D</strong> brings together <strong>3D modeling</strong>, <strong>original 3D printed products</strong>, and <strong>web development</strong>. <br/>Explore <strong>digital models</strong> for your own projects, find a <strong>creative gift</strong>, or commission <strong>a website for business</strong>.<br/> Have a product idea or need a website for your business? <br/>Get in touch through my contact page to discuss your project, timeline, and pricing."
    quote: "I don't want to find my place in the world. I want to create my own."
