  aboutme: 
    title: "About Me"
    text1: "Hi, I’m Yuliia, a web developer and 3D artist from Ukraine. I graduated from Sumy State University with a degree in Mathematics and Programming (Specialist in Systems Sciences and Cybernetics: Informatics)."
    subtitle2: "Education and Experience"
    text2: "I have a solid technical education and hands-on experience in development and working with modern digital tools. I have a strong understanding of computer system architecture, programming logic, and the principles behind creating high-quality IT products. I quickly learn new technologies and seamlessly combine technical expertise with creative thinking — allowing me to deliver well-crafted, user-friendly, and visually appealing products for my clients."
    subtitle3: "My Passion"
    text3: "My passion lies in the visual side of the digital world — design, 3D art, and motion. I love creating things that are not only functional but also beautiful and emotionally engaging. Whether it’s a website, a 3D model, or a short animation — I always aim to make it meaningful and full of life."
    subtitle4: "My Dream"
    text4: "My biggest dream is to become one of the leading creators of children’s animated films in Ukraine — stories that not only teach, but also touch the heart. I believe that art and technology can work together to inspire kindness, imagination, and hope."
    subtitle5: "How I can be helpful"
    text5: "As a web developer and digital artist, I can create modern, visually appealing, and user-friendly websites — from landing pages and personal portfolios to small business sites. I pay attention to both design and functionality, ensuring every project not only looks good but also works smoothly and communicates your message effectively. I can also help with SEO optimization, UI/UX improvements, and integration with analytics or contact forms — everything needed to make your online presence stand out."
    quote: "Create art and technology that touch the future — and hearts will follow."
