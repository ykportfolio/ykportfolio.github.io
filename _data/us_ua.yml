  aboutme:
    title: "Про мене"
    subtitle1: "Життя — не пряма дорога"
    text1: "Я люблю рух. Не обов’язково знати, куди саме він приведе. Іноді найцікавіше — просто звернути з дороги й подивитися, що буде далі. <br/> Моя пристрасть — швидкість, мотоцикли й дороги без чіткого маршруту. Побачити нові красиві місця, відчути вітер, свободу і той момент, коли ти просто їдеш, не думаючи, що буде за наступним поворотом. Люблю гарячу баню і холодну ополонку — коли можна вимкнути голову й нарешті відчути власне тіло. Люблю моменти, коли нікуди не треба поспішати. <br/> І дуже люблю свою сім’ю. Це, мабуть, найдорожче, що в мене є. <br/>Я мама трьох дівчаток, тому час із ними для мене справді важливий. Я не хочу одного дня озирнутися назад і зрозуміти, що найкращі роки пройшли десь між дедлайнами. <br/>Я не женуся за дорогими речами й не викладаю кожен свій крок у соціальні мережі заради схвалення. Життя напоказ — це не моя фішка.<br/>Мені набагато важливіше прожити момент, ніж отримати сотню чужих реакцій на нього. <br/>Мені важливо жити, а не демонструвати, як я живу.<br/>Проте якщо знаходиться однодумець, я завжди за спілкування. Мені цікаві люди, з якими можна обговорювати ідеї, мрії, технології, дивні задумки й нові можливості.<br/>Мабуть, саме такі розмови мені й потрібні — не заради кількості знайомств, а заради нових думок."
    subtitle2: "Мені подобається розбиратися"
    text2: "Я Юлія — веброзробниця, 3D-художниця та людина, якій постійно цікаво перевіряти: а що, якщо зробити інакше?<br/>Я закінчила Сумський державний університет та здобула ступінь спеціаліста за спеціальністю «Комп’ютерні науки та інформатика».<br/>Працювала з веброзробкою, дизайном, SEO та цифровими інструментами. Зараз розвиваюся в 3D, 3D-друці, анімації, штучному інтелекті та автоматизації.<br/>Мене не лякає технологія, якої я не знаю.<br/>Навпаки.<br/>Якщо я чогось не вмію — мені стає цікаво.<br/>Я люблю створювати.<br/>Сайт, який працює не так, як усі.<br/>3D-модель, яку можна не лише уявити, а й покрутити у 3D-середовищі.<br/>Фізичний продукт, якого ще ніхто не робив.<br/>Анімацію, історію, освітній проєкт, технологію.<br/>Можливо, одного дня — щось, для чого сьогодні ще навіть немає назви професії."    
    subtitle3: "Мені не дуже підходять рамки"
    text3: "Мені подобається стояти на межі між цифровим і реальним світом і дивитися, що можна з цього придумати.Саме тому я не дуже прагну до класичної роботи з 8 до 5.<br/>Не тому, що не люблю працювати.<br/>Коли мене щось захоплює, я можу працювати над цим до ночі. Але я не хочу вимірювати свою цінність кількістю годин, проведених перед комп’ютером.<br/>Творчість задихається там, де головним показником стає присутність на робочому місці.<br/>Мені потрібен простір думати, пробувати, помилятися, змінювати напрямок і знову починати.<br/>Мені потрібна свобода.<br/>І водночас мені потрібен час для людей, яких я люблю.<br/>Можливо, через якийсь час я працюватиму повний робочий день. Але це має бути проєкт, який мені справді цікавий. Бо працювати лише заради грошей — для мене прямий шлях до вигорання.<br/>Я не знаю, якою буде моя робота через десять років.<br/>І, чесно кажучи, не хочу знати.<br/>Бо мені подобається, що попереду ще багато невідомого."
    subtitle4: "Що я можу для вас зробити"
    text4: "Я можу допомогти перетворити ідею на щось реальне.<br/>Сайт, який не просто «є в інтернеті», а працює на вашу задачу. Продумати структуру, дизайн і подачу, зробити зрозумілим складне, додати потрібну функціональність і не залишити після себе хаос, який потім доведеться розгрібати.<br/>Можу підхопити проєкт там, де він застряг, розібратися з тим, що не працює, або разом придумати рішення, якого спочатку взагалі не було.<br/>Мені цікаві задачі, де потрібно думати, а не просто виконувати список інструкцій.<br/>Але є один нюанс.<br/>Я не ваша людина, якщо вам потрібен просто виконавець, який мовчки зробить «як сказали», поставить галочку й піде.<br/>Я ставитиму запитання. Можу не погодитися. Можу запропонувати інший варіант. І якщо бачу, що рішення можна зробити краще — скажу про це.<br/>Зате якщо вам потрібна людина, яка не боїться розібратися, придумати, спробувати нове й довести ідею до результату — можливо, нам по дорозі."
    quote: "Я не хочу знайти своє місце у світі. Я хочу створити своє."
