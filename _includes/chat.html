<!-- AI Button -->
<button id="ai-toggle" class="ai-toggle">
    <span class="ai-icon">◎</span>
    <span>AI LAB</span>
</button>

<!-- AI Chat -->
<div id="ai-chat" class="ai-chat">

    <div class="ai-header">
        <div>
            <div class="title">WEBand3D AI</div>
            <div class="subtitle">Digital Lab Assistant</div>
        </div>

        <button id="ai-close" class="close-btn">✕</button>
    </div>

    <div id="chat-messages" class="chat-messages">

        <div class="message ai">
            👋 Hello!<br><br>

            I can answer questions about:

            <ul>
                <li>3D Printing</li>
                <li>Web Development</li>
                <li>CGI</li>
                <li>Products</li>
                <li>Prices</li>
            </ul>

        </div>

    </div>

    <div class="chat-input">

        <textarea
            id="message"
            placeholder="Ask the Lab..."
        ></textarea>

        <button id="send">
            ➜
        </button>

    </div>

</div>
